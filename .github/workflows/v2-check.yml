name: v2 — typecheck & i18n

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-check.yml'
  pull_request:
    paths:
      - 'v2/**'

defaults:
  run:
    working-directory: v2

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all packages)
        run: pnpm typecheck

      - name: i18n parity
        run: pnpm --filter @carinjury/web check-i18n

      - name: Build
        run: pnpm build
