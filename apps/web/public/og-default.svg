<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Car Injury Clinic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a1c5a"/>
      <stop offset="0.55" stop-color="#7A2E87"/>
      <stop offset="1" stop-color="#BA93C2"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.2" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#BA93C2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#BA93C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.85" cy="0.8" r="0.55">
      <stop offset="0" stop-color="#806AAA" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#806AAA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#blob1)"/>
  <rect width="1200" height="630" fill="url(#blob2)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Badge -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" rx="40" ry="40" width="320" height="56" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <circle cx="32" cy="28" r="6" fill="#10b981"/>
    <text x="56" y="36" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="2">CITAS EL MISMO DÍA</text>
  </g>

  <!-- Title -->
  <text x="80" y="285" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="88" font-weight="800" letter-spacing="-1.5">Car Injury Clinic</text>
  <text x="80" y="355" fill="#ffffff" fill-opacity="0.85" font-family="Manrope, system-ui, sans-serif" font-size="36" font-weight="500">Atención médica y apoyo legal</text>
  <text x="80" y="400" fill="#ffffff" fill-opacity="0.85" font-family="Manrope, system-ui, sans-serif" font-size="36" font-weight="500">después de un accidente.</text>

  <!-- Pills -->
  <g font-family="Manrope, system-ui, sans-serif" font-size="20" font-weight="600">
    <g transform="translate(80, 480)">
      <rect x="0" y="0" rx="28" ry="28" width="270" height="48" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="28" y="32" fill="#ffffff">Atención bilingüe</text>
    </g>
    <g transform="translate(370, 480)">
      <rect x="0" y="0" rx="28" ry="28" width="240" height="48" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="28" y="32" fill="#ffffff">Apoyo legal</text>
    </g>
    <g transform="translate(630, 480)">
      <rect x="0" y="0" rx="28" ry="28" width="270" height="48" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="28" y="32" fill="#ffffff">Transporte gratis</text>
    </g>
  </g>

  <!-- Phone bottom-right -->
  <g transform="translate(880, 80)">
    <rect x="0" y="0" rx="34" ry="34" width="240" height="68" fill="#BA93C2"/>
    <text x="36" y="44" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="26" font-weight="800">385-242-8571</text>
  </g>

  <!-- Domain -->
  <text x="80" y="585" fill="#ffffff" fill-opacity="0.7" font-family="Manrope, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="2">CARINJURYCLINICS.COM</text>
</svg>
